[package]
name = "menumini-core-wasm"
version = "0.1.0"
edition = "2021"
description = "High-speed HMAC-SHA256 capability derivation and validation module for MenuMini"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
